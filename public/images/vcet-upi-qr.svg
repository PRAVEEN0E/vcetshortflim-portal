    <rect x="170" y="275" width="28" height="14" rx="2"/>
    <rect x="215" y="275" width="14" height="14" rx="2"/>
    <rect x="245" y="275" width="40" height="14" rx="2"/>
    <rect x="300" y="275" width="14" height="14" rx="2"/>
