  <circle cx="200" cy="180" r="4" fill="#F59E0B"/>
  <circle cx="200" cy="170" r="3" fill="#F59E0B"/>
  <circle cx="200" cy="190" r="3" fill="#F59E0B"/>
  <circle cx="190" cy="180" r="3" fill="#F59E0B"/>
  <circle cx="210" cy="180" r="3" fill="#F59E0B"/>

  <!-- Bottom UPI Label text -->
  <text x="200" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0D0F17" letter-spacing="1">
