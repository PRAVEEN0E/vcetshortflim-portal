<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="24" fill="#0F111A"/>
  <rect x="2" y="2" width="396" height="396" rx="22" fill="none" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Inner QR White Surface -->
  <rect x="25" y="25" width="350" height="350" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Top-Left Target -->
  <rect x="55" y="55" width="70" height="70" rx="8" fill="#111827"/>
  <rect x="67" y="67" width="46" height="46" rx="4" fill="#FFFFFF"/>
  <rect x="77" y="77" width="26" height="26" rx="2" fill="#D97706"/>

  <!-- Top-Right Target -->
  <rect x="275" y="55" width="70" height="70" rx="8" fill="#111827"/>
  <rect x="287" y="67" width="46" height="46" rx="4" fill="#FFFFFF"/>
